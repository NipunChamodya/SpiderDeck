[crawl]
# Domains SpiderDeck is allowed to fetch from. Add your own before crawling.
allowed_domains = []
max_pages = 50
max_depth = 2
delay_seconds = 1.5
respect_robots_txt = true
user_agent = "SpiderDeckBot/0.1 (+authorized personal research tool)"
allow_localhost = false
timeout_seconds = 10.0
max_retries = 2
max_redirects = 3
max_requests = 200
max_frontier = 1000
max_response_bytes = 2097152
max_total_bytes = 10485760
max_records = 10000
max_duration_seconds = 120.0

[output]
dir = "output"

[import]
max_file_bytes = 20971520
max_expanded_bytes = 104857600
max_archive_members = 5000
max_xml_depth = 100
max_spreadsheet_columns = 1024
max_records = 20000
max_text_chars = 10000000
max_pdf_pages = 500
min_pdf_text_chars = 10

[fx]
enabled = true

[ranking]
offline_only = true
text_weight = 1.0
keyword_weight = 0.0
domain_weight = 0.0
max_records = 5000
max_total_chars = 2000000
max_chars_per_record = 20000
max_features = 30000
max_ideas = 20
top_k = 10
