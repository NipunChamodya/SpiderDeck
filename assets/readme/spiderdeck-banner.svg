<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">SpiderDeck — collect intelligently, investigate locally</title>
<desc id="desc">A geometric eight-legged spider connects website, document, project, extraction, SQLite, search and evidence nodes. A static dark research console with cyan and green accents.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#080B12"/></linearGradient>
