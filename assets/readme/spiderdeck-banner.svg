 <radialGradient id="halo"><stop stop-color="#00D9FF" stop-opacity=".13"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1200" height="460" rx="18" fill="url(#bg)"/>
