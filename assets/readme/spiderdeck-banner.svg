 <text x="48" y="134" fill="#00FF9C" font-size="12" font-weight="600" letter-spacing="3">RESEARCH, WITH A SOURCE TRAIL.</text>
 <text x="42" y="211" fill="#F8FAFC" font-size="69" font-weight="750" letter-spacing="-2">SPIDERDECK</text>
 <text x="48" y="257" fill="#F8FAFC" font-size="25" font-weight="500">Collect intelligently.</text>
 <text x="48" y="292" fill="#00D9FF" font-size="25" font-weight="500">Investigate locally.</text>
 <text x="48" y="339" fill="#94A3B8" font-size="15">Authorized websites. Local documents.</text>
 <text x="48" y="362" fill="#94A3B8" font-size="15">One source-attributed research workspace.</text>
</g>
