<svg xmlns="http://www.w3.org/2000/svg" width="800" height="610" viewBox="0 0 800 610" role="img" aria-labelledby="title desc"><title id="title">SpiderDeck research pipeline</title><desc id="desc">A research project sets the topic. Approved static website requests pass network policy, robots and limits; explicitly selected local documents pass file and parser checks. Both feed extraction, conservative normalization, optional project relevance scoring, transactional SQLite storage, and search, browsing or export. Quick workflows omit topic filtering.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#00D9FF"/></marker></defs><rect x="1" y="1" width="798" height="608" rx="16" fill="#080B12" stroke="#273449"/><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle"><text x="400" y="37" font-size="11" letter-spacing="3" fill="#94A3B8">FROM AUTHORIZED SOURCE TO RESEARCH EVIDENCE</text><rect x="230" y="57" width="340" height="57" rx="8" fill="#101827" stroke="#34465B"/><rect x="230" y="69" width="3" height="33" fill="#8B5CF6"/><text x="400.0" y="82" font-size="17" font-weight="600" fill="#F8FAFC">Research project</text><text x="400.0" y="103" font-size="12" fill="#CBD5E1">Title · reviewed concepts · collection mode</text><rect x="35" y="150" width="350" height="76" rx="8" fill="#101827" stroke="#34465B"/><rect x="35" y="162" width="3" height="52" fill="#00D9FF"/><text x="210.0" y="175" font-size="17" font-weight="600" fill="#F8FAFC">Approved website</text><text x="210.0" y="196" font-size="12" fill="#CBD5E1">Exact host → DNS/IP + TLS → robots + budgets</text><rect x="415" y="150" width="350" height="76" rx="8" fill="#101827" stroke="#34465B"/><rect x="415" y="162" width="3" height="52" fill="#00FF9C"/><text x="590.0" y="175" font-size="17" font-weight="600" fill="#F8FAFC">Selected local document</text><text x="590.0" y="196" font-size="12" fill="#CBD5E1">Readable file → size + archive + parser checks</text><rect x="130" y="270" width="540" height="62" rx="8" fill="#101827" stroke="#34465B"/><rect x="130" y="282" width="3" height="38" fill="#00D9FF"/><text x="400.0" y="295" font-size="17" font-weight="600" fill="#F8FAFC">Extract + normalize</text><text x="400.0" y="316" font-size="12" fill="#CBD5E1">Retain original text, structured evidence and provenance</text><rect x="130" y="369" width="540" height="62" rx="8" fill="#101827" stroke="#34465B"/><rect x="130" y="381" width="3" height="38" fill="#8B5CF6"/><text x="400.0" y="394" font-size="17" font-weight="600" fill="#F8FAFC">Score for the project</text><text x="400.0" y="415" font-size="12" fill="#CBD5E1">Explain matches · save relevant / review · report skipped</text><rect x="130" y="468" width="540" height="62" rx="8" fill="#101827" stroke="#34465B"/><rect x="130" y="480" width="3" height="38" fill="#00FF9C"/><text x="400.0" y="493" font-size="17" font-weight="600" fill="#F8FAFC">Transactional SQLite</text><text x="400.0" y="514" font-size="12" fill="#CBD5E1">Shared records · assessments · source metadata · history</text><text x="400" y="578" font-size="16" fill="#F8FAFC">Search / browse / export</text></g><g fill="none" stroke="#00D9FF" stroke-width="1.3" marker-end="url(#arrow)"><path d="M340 114V130H210V146"/><path d="M460 114V130H590V146"/><path d="M210 226V247H400V266"/><path d="M590 226V247H400"/><path d="M400 332V365"/><path d="M400 431V464"/><path d="M400 530V552"/></g></svg>
